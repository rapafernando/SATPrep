{% extends "base.html" %}
{% block title %}Change password · {{ APP_NAME }}{% endblock %}
{% block content %}
<p><a class="backlink" href="{% url 'me' %}">← Back to Me</a></p>
<h1>Change password</h1>
<section class="card narrow">
  <form method="post" novalidate>{% csrf_token %}
    {% include "partials/_form.html" %}
    <p class="muted small-print">Changing it signs out your other phones and browsers.</p>
    <button class="btn block" type="submit">Save new password</button>
  </form>
</section>
{% endblock %}
